<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Adam Okhotskiy — TypeScript · Bun · React · TanStack">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140A33"/>
      <stop offset="0.45" stop-color="#45206B"/>
      <stop offset="0.75" stop-color="#A22C6B"/>
      <stop offset="1" stop-color="#FF9A5C"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A2D63"/>
      <stop offset="0.5" stop-color="#3A1A56"/>
      <stop offset="1" stop-color="#160A33"/>
    </linearGradient>
    <radialGradient id="sunfill" cx="0.5" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#FFE29A"/>
      <stop offset="0.55" stop-color="#FFB36B"/>
      <stop offset="1" stop-color="#FF5E7E"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="880" height="300" rx="18"/>
    </clipPath>
    <mask id="sunmask">
      <circle cx="440" cy="212" r="86" fill="white"/>
      <rect x="340" y="174" width="200" height="7" fill="black"/>
      <rect x="340" y="190" width="200" height="9" fill="black"/>
      <rect x="340" y="207" width="200" height="11" fill="black"/>
    </mask>
    <filter id="glowBig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glowText" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <!-- sky -->
    <rect width="880" height="300" fill="url(#sky)"/>

    <!-- twinkling stars -->
    <g fill="#FFE9C9">
      <circle cx="60" cy="40" r="1.5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.1s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="92" r="1.2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.6s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="50" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" begin="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="104" r="1.1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.9s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="34" r="1.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.4s" begin="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="82" r="1.2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.4s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="44" r="1.5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.4s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="790" cy="96" r="1.3"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="2.8s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="58" r="1.6"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="4.1s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="100" cy="134" r="1.2"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.6s" begin="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="142" r="1.0"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.2s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="122" r="1.4"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.7s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="140" r="1.1"><animate attributeName="opacity" values="0.1;0.65;0.1" dur="3.9s" begin="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="36" cy="176" r="1.0"><animate attributeName="opacity" values="0.1;0.55;0.1" dur="4.6s" begin="1.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- shooting star easter egg -->
    <path d="M598 36 L662 58" stroke="#FFD9B0" stroke-width="2.5" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.68;0.74;0.8;1" dur="9s" repeatCount="indefinite"/>
    </path>

    <!-- pulsing sun glow -->
    <circle cx="440" cy="212" r="100" fill="#FF7A59" filter="url(#glowBig)" opacity="0.5">
      <animate attributeName="opacity" values="0.38;0.62;0.38" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- striped sun -->
    <circle cx="440" cy="212" r="86" fill="url(#sunfill)" mask="url(#sunmask)"/>

    <!-- sea -->
    <rect y="210" width="880" height="90" fill="url(#sea)"/>

    <!-- shimmering sun reflection -->
    <g fill="#FFB36B">
      <rect x="400" y="218" width="80" height="4" rx="2" opacity="0.45"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="410" y="230" width="60" height="4" rx="2" opacity="0.4"><animate attributeName="opacity" values="0.15;0.55;0.15" dur="4s" begin="0.6s" repeatCount="indefinite"/></rect>
      <rect x="392" y="244" width="96" height="5" rx="2" opacity="0.3"><animate attributeName="opacity" values="0.12;0.45;0.12" dur="3.6s" begin="1.1s" repeatCount="indefinite"/></rect>
      <rect x="416" y="260" width="48" height="4" rx="2" opacity="0.25"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="4.4s" begin="0.3s" repeatCount="indefinite"/></rect>
      <rect x="404" y="278" width="72" height="4" rx="2" opacity="0.2"><animate attributeName="opacity" values="0.08;0.35;0.08" dur="5s" begin="1.8s" repeatCount="indefinite"/></rect>
    </g>

    <!-- back wave, drifting left -->
    <path fill="#B95C8F" opacity="0.45" d="M -240 224 Q -210 218 -180 224 T -120 224 T -60 224 T 0 224 T 60 224 T 120 224 T 180 224 T 240 224 T 300 224 T 360 224 T 420 224 T 480 224 T 540 224 T 600 224 T 660 224 T 720 224 T 780 224 T 840 224 T 900 224 T 960 224 T 1020 224 T 1080 224 T 1140 224 L 1140 300 L -240 300 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="9s" repeatCount="indefinite"/>
    </path>

    <!-- front wave, drifting right -->
    <path fill="#55286E" opacity="0.7" d="M -240 248 Q -210 239 -180 248 T -120 248 T -60 248 T 0 248 T 60 248 T 120 248 T 180 248 T 240 248 T 300 248 T 360 248 T 420 248 T 480 248 T 540 248 T 600 248 T 660 248 T 720 248 T 780 248 T 840 248 T 900 248 T 960 248 T 1020 248 T 1080 248 T 1140 248 L 1140 300 L -240 300 Z">
      <animateTransform attributeName="transform" type="translate" from="-120 0" to="0 0" dur="6.5s" repeatCount="indefinite"/>
    </path>

    <!-- dunes -->
    <ellipse cx="120" cy="268" rx="115" ry="16" fill="#1C0E38"/>
    <ellipse cx="750" cy="266" rx="85" ry="13" fill="#1C0E38"/>

    <!-- palm tree, left -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2.2 150 258; 2.2 150 258; -2.2 150 258" dur="7s" repeatCount="indefinite"/>
      <path d="M150 258 C 146 226, 154 202, 174 182" stroke="#170B2E" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M174 182 C 150 170, 124 172, 104 190 C 130 182, 152 182, 172 190 Z" fill="#170B2E"/>
      <path d="M174 182 C 198 172, 226 176, 246 194 C 220 184, 196 184, 176 190 Z" fill="#170B2E"/>
      <path d="M174 182 C 162 158, 140 146, 116 148 C 142 158, 158 170, 172 188 Z" fill="#170B2E"/>
      <path d="M174 182 C 186 158, 208 148, 232 152 C 208 162, 190 172, 176 188 Z" fill="#170B2E"/>
      <path d="M174 182 C 172 158, 178 140, 194 128 C 184 148, 182 164, 178 186 Z" fill="#170B2E"/>
      <circle cx="169" cy="187" r="5" fill="#170B2E"/>
      <circle cx="181" cy="189" r="4.5" fill="#170B2E"/>
    </g>

    <!-- palm tree, right -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="1.8 748 260; -1.8 748 260; 1.8 748 260" dur="8.5s" repeatCount="indefinite"/>
      <path d="M748 260 C 750 238, 744 220, 732 204" stroke="#170B2E" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M732 204 C 714 194, 692 196, 676 210 C 698 202, 716 202, 732 208 Z" fill="#170B2E"/>
      <path d="M732 204 C 752 196, 776 200, 792 216 C 770 206, 750 206, 734 210 Z" fill="#170B2E"/>
      <path d="M732 204 C 722 184, 704 174, 684 176 C 706 184, 720 194, 730 208 Z" fill="#170B2E"/>
      <path d="M732 204 C 742 184, 760 176, 780 180 C 760 188, 746 196, 734 208 Z" fill="#170B2E"/>
      <path d="M732 204 C 730 184, 736 170, 748 160 C 740 178, 738 190, 736 206 Z" fill="#170B2E"/>
      <circle cx="728" cy="208" r="4" fill="#170B2E"/>
    </g>

    <!-- birds -->
    <g stroke="#FFD9B0" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M548 64 q 9 -9 18 0 q 9 -9 18 0"/>
      <path d="M604 86 q 7 -7 14 0 q 7 -7 14 0"/>
    </g>

    <!-- name -->
    <text x="440" y="92" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="54" font-weight="bold" letter-spacing="2" fill="#FF7A59" filter="url(#glowText)" opacity="0.85">ADAM OKHOTSKIY</text>
    <text x="440" y="92" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="54" font-weight="bold" letter-spacing="2" fill="#FFF6E8" stroke="#241042" stroke-width="5" paint-order="stroke">ADAM OKHOTSKIY</text>

    <!-- stack line -->
    <text x="440" y="134" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="19" letter-spacing="5" fill="#FFC9A3" stroke="#241042" stroke-width="3.5" paint-order="stroke">TYPESCRIPT · BUN · REACT · TANSTACK</text>
  </g>
</svg>
